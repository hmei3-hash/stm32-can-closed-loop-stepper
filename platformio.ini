; ============================================================================
; Filename    : platformio.ini
; Author      : Hongyi Mei
; Date        : 2026-08-10
; Description : PlatformIO build configuration for the STM32 CAN-based
;               closed-loop stepper motor controller. This tree builds the
;               STM32 motor node only; the ESP32 supervisory node lives in a
;               separate tree (added at Phase 6b). Build variants are
;               selected via macros defined per environment.
; ============================================================================

[platformio]
default_envs = node0

; ---------------------------------------------------------------------------
; Common settings shared by every environment
; ---------------------------------------------------------------------------
[env]
platform  = ststm32
board     = nucleo_f446re
framework = stm32cube

; ST-LINK is on-board; use `upload_port`/`debug_port` overrides if two boards
; are connected simultaneously (see README "Flashing two boards").
upload_protocol = stlink
debug_tool      = stlink

; -Og keeps the debugger honest; -g3 emits macro info for gdb.
build_flags =
    -Og
    -g3
    -Wall
    -Wextra
    -Wshadow
    -Wundef
    -ffunction-sections
    -fdata-sections
    -DUSE_HAL_DRIVER
    -DSTM32F446xx
    -DHSE_VALUE=8000000U        ; MCO from ST-LINK on Nucleo boards

build_unflags =
    -Os

; Newlib-nano: no float in printf. Drop -u _printf_float if you never need it.
build_src_flags =
    -Wconversion

monitor_speed = 115200

; ---------------------------------------------------------------------------
; node0 - motor node. Drives TMC2209, reads AS5600, runs the position loop.
; ---------------------------------------------------------------------------
[env:node0]
build_flags =
    ${env.build_flags}
    -DNODE_ID=0
    -DROLE_MOTOR=1

; ---------------------------------------------------------------------------
; canloop - Phase 6a. Brings up CAN1 in loopback/silent mode so bit timing,
;           acceptance filters, FIFO handling, and ISRs can be validated with
;           no second node and no transceiver attached.
; ---------------------------------------------------------------------------
[env:canloop]
build_flags =
    ${env.build_flags}
    -DNODE_ID=0
    -DROLE_MOTOR=1
    -DCAN_LOOPBACK_SELFTEST=1

; ---------------------------------------------------------------------------
; release - size/speed optimized, asserts compiled out
; ---------------------------------------------------------------------------
[env:release]
build_flags =
    ${env.build_flags}
    -DNODE_ID=0
    -DROLE_MOTOR=1
    -DNDEBUG
build_unflags =
    -Og
    -g3
